name: Veri paketleri

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Sadece bu ulkeler (bosluklu, ornek: "de us"). Bos birakilirsa hepsi yenilenir.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  # Tek is 6 saati gecemez: ulkeler parcalara bolunur. Geofabrik'e yuk bindirmemek icin ikiser ikiser calisir.
  shard:
    if: ${{ inputs.only == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --omit=dev
      - run: node --max-old-space-size=13000 scripts/import-osm.mjs --configured --shard=${{ matrix.shard }}/8
        continue-on-error: true # Basarili ulkeler yine yayinlanir, digerlerinin eski paketi kalir
      - run: node scripts/build-packs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packs-${{ matrix.shard }}
          path: data/packs
          retention-days: 3

  # Elle secilen ulkeler (ornegin ABD gibi buyuk dosyalar): tek is, once disk bosaltilir
  targeted:
    if: ${{ inputs.only != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ONLY: ${{ inputs.only }}
    steps:
      - name: Disk alani ac
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --omit=dev
      - run: node --max-old-space-size=13000 scripts/import-osm.mjs $ONLY --force
        continue-on-error: true # Basarili ulkeler yine yayinlanir
      - run: node scripts/build-packs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packs-targeted
          path: data/packs
          retention-days: 3

  publish:
    needs: [shard, targeted]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - run: gh release download packs --pattern manifest.json --dir previous
      - run: node scripts/merge-manifest.mjs previous/manifest.json incoming manifest.json
      - run: gh release upload packs incoming/*/*.db --clobber
      # Liste en son yuklenir: telefon dosyasi henuz gelmemis bir surumu gormez
      - run: gh release upload packs manifest.json --clobber
